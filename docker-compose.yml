version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: napak_tilas_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=sqlite:////app/data/napak_tilas.db
      - TESSERACT_CMD=/usr/bin/tesseract
    volumes:
      - backend_data:/app/data
    ports:
      - "8000:8000"
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: napak_tilas_frontend
    restart: unless-stopped
    environment:
      - PORT=3000
      - BACKEND_URL=http://backend:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - app_network

volumes:
  backend_data:

networks:
  app_network:
    driver: bridge
